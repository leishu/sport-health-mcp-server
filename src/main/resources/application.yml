server:
  # MCP 端点固定为 POST /mcp；对外暴露时建议放在网关或 Spring Security 后面
  port: 8080

spring:
  application:
    name: sport-health-mcp-server
  # 只用 JdbcClient 显式建库，屏蔽 Spring Boot 的数据源自动配置
  # （否则 SqliteDataSource + Hikari 的组合会在启动阶段就抢着建连接）
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcClientAutoConfiguration
  ai:
    mcp:
      server:
        name: sport-health-mcp-server
        version: 1.0.0
        # SYNC：工具方法是同步阻塞的，由 MCP 层负责调度
        type: SYNC
        # STREAMABLE：Streamable-HTTP，端点 POST /mcp（SSE 在 Spring AI 2.x 已废弃）
        protocol: STREAMABLE

sport:
  health:
    # TCX 目录：支持 classpath: 前缀，也支持本地绝对路径（如 /home/leishu/health-export）
    # 只会扫描该目录下的 *.tcx，其它文件会被忽略；解析结果写入 SQLite，删除源文件不丢历史数据
    data-dir: classpath:health-data
    # SQLite 数据库文件；相对路径按进程工作目录解析，目录不存在会自动创建
    db-path: ./data/sport-health.db
    # TCX 内时间为 UTC，换算成本地日期用的时区（影响 date 字段与按天聚合）
    zone-id: Asia/Shanghai
    # 列表接口未显式传 limit 时的默认条数
    default-page-size: 20
    # 列表接口允许的最大条数；小于 default-page-size 时会被提升到相同值
    max-page-size: 200

  # open-meteo 天气回填：为每条跑步记录补上起跑与结束时刻的天气，写入 run_weather 表
  weather:
    # 关掉后导入流程完全不碰网络；数据已经回填过的记录不受影响
    enabled: true
    # 预报端点覆盖「今天往前 recent-window-days 天」，数据完整、含实况
    forecast-base-url: https://api.open-meteo.com/v1/forecast
    # 更早的历史走存档端点（ERA5 再分析），有数天延迟
    archive-base-url: https://archive-api.open-meteo.com/v1/archive
    # 超过这个天数的记录改用 archive；92 是 forecast 端点 past 数据的上限
    recent-window-days: 92
    # 把 forecast 窗口最老的 lag 天交给 archive，避开 forecast 92 天上限边缘；
    # 应远小于 recent-window-days（默认 5 对 92 是安全的）
    archive-lag-days: 5
    # 单次请求超时
    timeout: 10s
    # 抓取失败的记录多久后重试；OK 与 UNAVAILABLE（接口无此数据）永不重试
    retry-failed-after-days: 7
    # 单次同步最多回填多少条，防止首次全量导入一次打光配额（非商业用途 10000 次/天）
    max-runs-per-sync: 50

management:
  endpoints:
    web:
      exposure:
        # 只暴露健康检查与基础信息，避免把内部指标暴露到 MCP 端口
        include: health,info
